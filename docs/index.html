<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Compose Charts</title>
<meta name="description" content="Beautiful, animated, fully customizable charts for Jetpack Compose." />
<meta name="theme-color" content="#F2F5FA" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#121212" media="(prefers-color-scheme: dark)" />
<link rel="icon" href="logo.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<script>try{var t=localStorage.getItem("theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t}catch(e){}</script>
<style>
:root{
  --navy:#2F6FB0;--sky:#52B2D6;
  --gradient:linear-gradient(135deg,var(--navy),var(--sky));
  --bg:#f2f5fa;--surface:#fff;--surface-2:#f7f9fc;
  --text:#1b1f29;--text-muted:#5d6475;--text-faint:#8a91a3;
  --border:#e2e7ef;--border-strong:#d3dae4;
  --accent:#2F6FB0;--accent-text:#235d99;--accent-soft:#2f6fb017;--accent-soft-2:#2f6fb029;
  --header-bg:#f2f5fad1;
  --shadow:0 1px 2px #1b1f290a,0 8px 24px #1b1f290f;
  --shadow-lg:0 30px 60px -20px #2f6fb059,0 12px 24px -12px #1b1f292e;
  --code-bg:#f7f9fc;--code-head:#eef2f7;
  --tk-keyword:#2F6FB0;--tk-type:#7a3fc4;--tk-fn:#b1367a;--tk-string:#1d7f53;--tk-number:#b55a00;--tk-comment:#8a91a3;--tk-param:#3d7d9c;
  --radius-lg:24px;--radius:16px;--radius-sm:10px;--header-h:64px;--sidebar-w:264px;
  color-scheme:light;
}
:root[data-theme=dark]{
  --bg:#121212;--surface:#1e1e1e;--surface-2:#191919;
  --text:#e4e6eb;--text-muted:#a6abb6;--text-faint:#767c88;
  --border:#2a2b2e;--border-strong:#37393d;
  --accent:#4f93d6;--accent-text:#7cc0e6;--accent-soft:#4f93d624;--accent-soft-2:#4f93d63d;
  --header-bg:#121212cc;
  --shadow:0 1px 2px #0000004d,0 8px 24px #00000040;
  --shadow-lg:0 30px 60px -20px #2f6fb066,0 12px 24px -12px #00000080;
  --code-bg:#171717;--code-head:#1e1e1e;
  --tk-keyword:#7cc0e6;--tk-type:#c3a6ff;--tk-fn:#f19ac6;--tk-string:#79d3a0;--tk-number:#f2b26b;--tk-comment:#6f7584;--tk-param:#9fd3e8;
  color-scheme:dark;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme=light]){
    --bg:#121212;--surface:#1e1e1e;--surface-2:#191919;
    --text:#e4e6eb;--text-muted:#a6abb6;--text-faint:#767c88;
    --border:#2a2b2e;--border-strong:#37393d;
    --accent:#4f93d6;--accent-text:#7cc0e6;--accent-soft:#4f93d624;--accent-soft-2:#4f93d63d;
    --header-bg:#121212cc;
    --shadow:0 1px 2px #0000004d,0 8px 24px #00000040;
    --shadow-lg:0 30px 60px -20px #2f6fb066,0 12px 24px -12px #00000080;
    --code-bg:#171717;--code-head:#1e1e1e;
    --tk-keyword:#7cc0e6;--tk-type:#c3a6ff;--tk-fn:#f19ac6;--tk-string:#79d3a0;--tk-number:#f2b26b;--tk-comment:#6f7584;--tk-param:#9fd3e8;
    color-scheme:dark;
  }
}
.theme-dark-only,:root[data-theme=dark] .theme-light-only{display:none!important}
:root[data-theme=dark] .theme-dark-only{display:block!important}
@media (prefers-color-scheme:dark){
  :root:not([data-theme=light]) .theme-light-only{display:none!important}
  :root:not([data-theme=light]) .theme-dark-only{display:block!important}
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:calc(var(--header-h) + 24px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;transition:background-color .25s,color .25s}
body.no-scroll{overflow:hidden}
a{color:var(--accent-text);text-decoration:none}
a:hover{text-decoration:underline;text-underline-offset:3px}
img{max-width:100%;display:block}
code,pre{font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
button{font:inherit;color:inherit}
.skip-link{position:absolute;top:-48px;left:12px;z-index:100;background:var(--accent);color:#fff;border-radius:10px;padding:8px 14px}
.skip-link:focus{top:12px}

/* Header */
.site-header{position:sticky;top:0;z-index:40;height:var(--header-h);background:var(--header-bg);-webkit-backdrop-filter:saturate(1.6) blur(14px);backdrop-filter:saturate(1.6) blur(14px);border-bottom:1px solid var(--border)}
.header-inner{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;max-width:1360px;height:100%;margin:0 auto;padding:0 20px}
.brand{display:inline-flex;align-items:center;gap:10px;color:var(--text);font-weight:700;letter-spacing:-.01em}
.brand:hover{text-decoration:none}
.brand svg{border-radius:9px;flex-shrink:0}
.brand-name{font-size:17px;white-space:nowrap}
.version-pill{color:var(--accent-text);background:var(--accent-soft);border-radius:999px;padding:2px 8px;font-size:11.5px;font-weight:600}
.tabs{display:flex;gap:4px;padding:4px;background:var(--surface);border:1px solid var(--border);border-radius:999px;box-shadow:var(--shadow)}
.tab{color:var(--text-muted);border-radius:999px;padding:6px 18px;font-size:14.5px;font-weight:600;transition:color .2s,background-color .2s}
.tab:hover{color:var(--text);text-decoration:none}
.tab.active{background:var(--gradient);color:#fff;box-shadow:0 4px 14px -4px #2f6fb099}
.header-actions{display:flex;justify-content:flex-end;gap:4px}
.icon-btn{display:inline-grid;place-items:center;width:40px;height:40px;color:var(--text);background:none;border:0;border-radius:12px;cursor:pointer;transition:background-color .2s}
.icon-btn:hover{background:var(--accent-soft);text-decoration:none}
.menu-btn{display:none}

/* Home */
.home{max-width:1200px;margin:0 auto;padding:0 20px}
.hero{position:relative;padding:72px 0 40px}
.hero-glow{position:absolute;inset:-40px 0 auto;height:520px;pointer-events:none;background:radial-gradient(600px 300px at 20% 20%,#2f6fb026,transparent 70%),radial-gradient(500px 280px at 85% 30%,#52b2d626,transparent 70%);z-index:-1}
.hero-grid{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);gap:56px;align-items:center}
.hero-logo svg{border-radius:16px;box-shadow:var(--shadow-lg)}
.hero h1{font-size:clamp(38px,5.4vw,60px);line-height:1.05;letter-spacing:-.035em;margin:24px 0 18px;font-weight:800}
.grad-text{background:var(--gradient);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero .lead{font-size:18.5px;color:var(--text-muted);max-width:560px;margin:0 0 28px}
.install{display:flex;align-items:center;gap:10px;max-width:560px;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:8px 8px 8px 16px;box-shadow:var(--shadow)}
.install code{flex:1;min-width:0;overflow-x:auto;white-space:nowrap;font-size:13.5px;color:var(--text)}
.install code .tk-string{color:var(--tk-string)}
.copy-btn{display:inline-flex;align-items:center;gap:6px;flex-shrink:0;border:1px solid var(--border);background:var(--surface-2);color:var(--text-muted);border-radius:9px;padding:6px 10px;font-size:12.5px;font-weight:600;cursor:pointer;transition:all .2s}
.copy-btn:hover{color:var(--text);border-color:var(--border-strong)}
.copy-btn.copied{color:var(--tk-string)}
.cta-row{display:flex;flex-wrap:wrap;gap:12px;margin:24px 0 32px}
.btn{display:inline-flex;align-items:center;gap:8px;border-radius:12px;padding:12px 20px;font-weight:600;font-size:15px;transition:transform .2s,box-shadow .2s}
.btn:hover{text-decoration:none;transform:translateY(-1px)}
.btn-primary{background:var(--gradient);color:#fff;box-shadow:0 10px 24px -10px #2f6fb0b3}
.btn-ghost{background:var(--surface);color:var(--text);border:1px solid var(--border)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;list-style:none;padding:0;margin:0;max-width:560px}
.stats li,.stats a{display:flex;flex-direction:column;gap:2px}
.stats li{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:12px 14px}
.stats a{color:inherit}
.stats a:hover{text-decoration:none}
.stats strong{font-size:22px;letter-spacing:-.02em;line-height:1.2}
.stats span{font-size:12.5px;color:var(--text-muted)}

.showcase{display:flex;flex-direction:column;align-items:center;gap:18px}
.show-card{position:relative;width:100%;max-width:420px;aspect-ratio:1/1.08;background:var(--surface);border:1px solid var(--border);border-radius:28px;box-shadow:var(--shadow-lg);overflow:hidden;display:grid;place-items:center;padding:18px}
.show-card img{position:absolute;inset:18px;width:calc(100% - 36px);height:calc(100% - 36px);object-fit:contain;opacity:0;transition:opacity .5s}
.show-card img.on{opacity:1}
.showcase-caption{display:flex;flex-direction:column;align-items:center;gap:10px}
.showcase-name{font-weight:700;font-size:18px;color:var(--text)}
.showcase-name span{color:var(--text-faint);font-weight:500}
.showcase-dots{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;max-width:320px}
.dot{width:8px;height:8px;border-radius:999px;border:0;padding:0;background:var(--border-strong);cursor:pointer;transition:all .25s}
.dot.active{width:22px;background:var(--gradient)}

.section-title{font-size:28px;letter-spacing:-.025em;margin:72px 0 8px;font-weight:800}
.section-sub{color:var(--text-muted);margin:0 0 24px}
.features{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;list-style:none;padding:0;margin:56px 0 0}
.feature{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:22px;box-shadow:var(--shadow)}
.feature-icon{display:inline-grid;place-items:center;width:38px;height:38px;border-radius:11px;background:var(--accent-soft);color:var(--accent-text);margin-bottom:12px}
.feature h2{font-size:16.5px;margin:0 0 6px;letter-spacing:-.01em}
.feature p{margin:0;color:var(--text-muted);font-size:14.5px}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
.g-card{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;color:inherit;transition:transform .2s,box-shadow .2s,border-color .2s}
.g-card:hover{text-decoration:none;transform:translateY(-3px);box-shadow:var(--shadow-lg);border-color:var(--border-strong)}
.g-card .g-img{background:var(--surface-2);border-bottom:1px solid var(--border);padding:12px;aspect-ratio:1/1;display:grid;place-items:center}
.g-card img{width:100%;height:100%;object-fit:contain}
.g-card .g-body{padding:12px 14px 14px}
.g-card h3{margin:0;font-size:15px}
.g-card p{margin:4px 0 0;font-size:13px;color:var(--text-muted);line-height:1.45}
.home-foot{text-align:center;color:var(--text-faint);font-size:14px;padding:64px 0 40px}

/* Docs */
.docs-layout{display:grid;grid-template-columns:var(--sidebar-w) minmax(0,1fr);max-width:1360px;margin:0 auto}
.sidebar{position:sticky;top:var(--header-h);height:calc(100vh - var(--header-h));overflow-y:auto;padding:28px 16px 40px 20px;border-right:1px solid var(--border)}
.side-group{margin-bottom:22px}
.side-group h4{margin:0 0 8px 10px;font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--text-faint)}
.side-link{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:10px;color:var(--text-muted);font-size:14.5px;font-weight:500}
.side-link:hover{background:var(--accent-soft);color:var(--text);text-decoration:none}
.side-link.active{background:var(--accent-soft-2);color:var(--accent-text);font-weight:600}
.side-link .thumb{width:7px;height:7px;border-radius:50%;background:var(--border-strong);flex-shrink:0;transition:background .2s}
.side-link:hover .thumb,.side-link.active .thumb{background:var(--gradient)}
.docs-main{min-width:0;padding:40px 48px 80px}
.doc-with-toc{display:grid;grid-template-columns:minmax(0,1fr) 200px;gap:48px;max-width:1040px}
.doc{min-width:0;max-width:780px}
.crumbs{font-size:13px;color:var(--text-faint);margin:0 0 6px;font-weight:500}
.doc h1{font-size:38px;letter-spacing:-.03em;line-height:1.15;margin:0 0 12px;font-weight:800}
.doc .lead{font-size:17.5px;color:var(--text-muted);margin:0 0 28px}
.doc h2{font-size:23px;letter-spacing:-.02em;margin:44px 0 12px;padding-top:4px}
.doc h3{font-size:17px;margin:28px 0 10px}
.doc p,.doc li{color:var(--text-muted)}
.doc p code,.doc li code,.doc td code,.callout code{font-size:.86em;background:var(--accent-soft);color:var(--accent-text);padding:2px 6px;border-radius:6px}
.doc ul,.doc ol{padding-left:22px}
.callout{background:var(--accent-soft);border:1px solid var(--accent-soft-2);border-radius:var(--radius-sm);padding:14px 16px;margin:20px 0;color:var(--text)!important;font-size:15px}
.callout code{background:var(--surface)!important}
figure.code{margin:16px 0 20px;background:var(--code-bg);border:1px solid var(--border);border-radius:14px;overflow:hidden}
figure.code figcaption{display:flex;align-items:center;gap:10px;padding:8px 10px 8px 14px;background:var(--code-head);border-bottom:1px solid var(--border)}
.code-dots{display:flex;gap:6px}
.code-dots i{width:10px;height:10px;border-radius:50%;background:var(--border-strong)}
.code-title{flex:1;font-size:12.5px;color:var(--text-faint);font-weight:600;font-family:"JetBrains Mono",monospace}
figure.code pre{margin:0;padding:16px 18px;overflow-x:auto;font-size:13.5px;line-height:1.65;color:var(--text)}
.tk-keyword{color:var(--tk-keyword);font-weight:500}.tk-type{color:var(--tk-type)}.tk-fn{color:var(--tk-fn)}.tk-string{color:var(--tk-string)}.tk-number{color:var(--tk-number)}.tk-comment{color:var(--tk-comment);font-style:italic}.tk-param{color:var(--tk-param)}
.preview{display:flex;justify-content:center;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:24px;margin:8px 0 28px;box-shadow:var(--shadow)}
.preview img{max-height:440px;width:auto;border-radius:12px}
.table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:14px;margin:16px 0}
table{width:100%;border-collapse:collapse;font-size:14.5px}
th,td{text-align:left;padding:10px 14px;border-bottom:1px solid var(--border);vertical-align:top}
th{background:var(--surface-2);color:var(--text);font-weight:600}
tr:last-child td{border-bottom:0}
td{color:var(--text-muted)}
td a{font-weight:600}
.toc{position:sticky;top:calc(var(--header-h) + 40px);align-self:start;font-size:13.5px}
.toc h4{margin:0 0 10px;font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--text-faint)}
.toc a{display:block;color:var(--text-muted);padding:4px 0 4px 12px;border-left:2px solid var(--border)}
.toc a:hover{color:var(--text);text-decoration:none}
.toc a.active{color:var(--accent-text);border-left-color:var(--accent)}
.pager{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:56px}
.pager a{display:flex;flex-direction:column;gap:2px;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px 16px;color:var(--text);font-weight:600}
.pager a:hover{text-decoration:none;border-color:var(--accent)}
.pager a span{font-size:12.5px;color:var(--text-faint);font-weight:500}
.pager a.next{text-align:right;grid-column:2}
.page-enter{animation:enter .35s ease both}
@keyframes enter{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.backdrop{display:none}

@media (max-width:1100px){.doc-with-toc{grid-template-columns:minmax(0,1fr)}.toc{display:none}}
@media (max-width:900px){
  .hero-grid{grid-template-columns:minmax(0,1fr);gap:40px}
  .features{grid-template-columns:repeat(2,1fr)}
  .docs-layout{grid-template-columns:minmax(0,1fr)}
  .sidebar{position:fixed;left:0;top:var(--header-h);z-index:35;width:min(300px,85vw);background:var(--bg);transform:translateX(-100%);transition:transform .25s;border-right:1px solid var(--border)}
  body.sidebar-open .sidebar{transform:none}
  body.sidebar-open .backdrop{display:block;position:fixed;inset:var(--header-h) 0 0;background:#0006;z-index:30}
  .menu-btn.show{display:inline-grid}
  .docs-main{padding:28px 16px 64px}
}
@media (max-width:640px){
  .header-inner{grid-template-columns:auto 1fr auto;padding:0 12px;gap:8px}
  .brand-name span,.version-pill{display:none}
  .tabs{justify-self:center}
  .tab{padding:6px 14px}
  .home{padding:0 16px}
  .hero{padding-top:40px}
  .stats{grid-template-columns:repeat(2,1fr)}
  .features{grid-template-columns:1fr}
  .doc h1{font-size:30px}
  .pager{grid-template-columns:1fr}
  .pager a.next{grid-column:1}
}
</style>
</head>
<body>
<a href="#main" class="skip-link">Skip to content</a>
<header class="site-header">
  <div class="header-inner">
    <div style="display:flex;align-items:center;gap:4px">
      <button type="button" class="icon-btn menu-btn" id="menuBtn" aria-label="Open docs menu">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
      <a class="brand" href="#/" aria-label="Compose Charts home">
        <span class="logo-slot" data-size="34"></span>
        <span class="brand-name">Compose<span> Charts</span></span>
        <span class="version-pill">v0.1.0</span>
      </a>
    </div>
    <nav class="tabs" aria-label="Main">
      <a class="tab" data-tab="home" href="#/">Home</a>
      <a class="tab" data-tab="docs" href="#/docs">Docs</a>
    </nav>
    <div class="header-actions">
      <a class="icon-btn" href="https://github.com/nameisjayant/Compose-Charts" target="_blank" rel="noreferrer" aria-label="GitHub repository">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M12 2a10 10 0 0 0-3.16 19.49c.5.09.68-.22.68-.48v-1.7c-2.78.6-3.37-1.34-3.37-1.34-.45-1.16-1.11-1.47-1.11-1.47-.91-.62.07-.6.07-.6 1 .07 1.53 1.03 1.53 1.03.9 1.52 2.34 1.08 2.91.83.09-.65.35-1.09.63-1.34-2.22-.25-4.55-1.11-4.55-4.94 0-1.09.39-1.98 1.03-2.68-.1-.25-.45-1.27.1-2.64 0 0 .84-.27 2.75 1.02a9.5 9.5 0 0 1 5 0c1.91-1.29 2.75-1.02 2.75-1.02.55 1.37.2 2.39.1 2.64.64.7 1.03 1.59 1.03 2.68 0 3.84-2.34 4.68-4.57 4.93.36.31.68.92.68 1.85v2.74c0 .27.18.58.69.48A10 10 0 0 0 12 2z"/></svg>
      </a>
      <button type="button" class="icon-btn" id="themeBtn" aria-label="Toggle light and dark theme">
        <svg class="theme-dark-only" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><circle cx="12" cy="12" r="4.2" fill="currentColor"/><g stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></g></svg>
        <svg class="theme-light-only" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z" fill="currentColor"/></svg>
      </button>
    </div>
  </div>
</header>

<main id="main"></main>
<div class="backdrop" id="backdrop"></div>

<script>
/* ---------- Data ---------- */
const VERSION = "0.1.0";
const REPO = "https://github.com/nameisjayant/Compose-Charts";
const MAVEN = "https://central.sonatype.com/artifact/io.github.nameisjayant/compose-charts";
const DEP = `implementation("io.github.nameisjayant:compose-charts:${VERSION}")`;

/* ---------- Kotlin / Gradle highlighter ---------- */
const KW = new Set(["val","var","by","fun","it","null","true","false","return","if","else","when","object","class","import","package"]);
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function highlight(src){
  const re = /(\/\/[^\n]*|\/\*[\s\S]*?\*\/)|("(?:[^"\\]|\\.)*")|\b(\d+(?:\.\d+)?f?|0x[0-9A-Fa-f]+)\b|([A-Za-z_][A-Za-z0-9_]*)/g;
  let out = "", last = 0, m;
  while ((m = re.exec(src))) {
    out += esc(src.slice(last, m.index));
    last = re.lastIndex;
    const [tok, comment, str, num, id] = m;
    if (comment) out += `<span class="tk-comment">${esc(tok)}</span>`;
    else if (str) out += `<span class="tk-string">${esc(tok)}</span>`;
    else if (num) out += `<span class="tk-number">${tok}</span>`;
    else {
      const rest = src.slice(last);
      if (KW.has(id)) out += `<span class="tk-keyword">${id}</span>`;
      else if (/^[A-Z]/.test(id)) out += `<span class="tk-type">${id}</span>`;
      else if (/^\s*=(?!=)/.test(rest)) out += `<span class="tk-param">${id}</span>`;
      else if (/^\s*[({]/.test(rest)) out += `<span class="tk-fn">${id}</span>`;
      else out += id;
    }
  }
  return out + esc(src.slice(last));
}
const COPY_ICON = `<svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="3" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>`;
const CODES = [];
function code(src, title="Kotlin", plain=false){
  const i = CODES.push(src) - 1;
  return `<figure class="code"><figcaption><span class="code-dots" aria-hidden="true"><i></i><i></i><i></i></span><span class="code-title">${title}</span><button type="button" class="copy-btn" data-code="${i}" aria-label="Copy code">${COPY_ICON}<span>Copy</span></button></figcaption><pre><code>${plain?esc(src):highlight(src)}</code></pre></figure>`;
}

let showTimer = null, showIndex = 0;
function setShow(i){
  const card = document.getElementById("showCard"); if (!card) return;
  showIndex = i;
  card.querySelectorAll("img").forEach((img,j)=>{ img.classList.toggle("on", j===i); img.alt = j===i ? `Animated ${CHARTS[j].name.toLowerCase()} chart` : ""; });
  document.querySelectorAll(".dot").forEach((d,j)=>{ d.classList.toggle("active", j===i); d.setAttribute("aria-selected", j===i); });
  const name = document.getElementById("showName");
  name.href = `#/docs/${CHARTS[i].id}`;
  name.innerHTML = `${CHARTS[i].name}<span> chart</span>`;
}
function startShow(){
  clearInterval(showTimer);
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  showTimer = setInterval(()=>setShow((showIndex+1)%CHARTS.length), 4000);
}

/* ---------- Docs ---------- */
const OVERVIEW_TOC = [["installation","Installation"],["two-ways","Card or bare chart"],["styling","Styling"],["animation","Animation"],["charts","All charts"],["sample-app","Sample app"],["contributing","Contributing"]];

function renderOverview(){
  return `<p class="crumbs">Docs / Overview</p>
<h1>Getting started</h1>
<p class="lead">Every chart in Compose Charts shares one shape of API: your data, an optional title and a set of <code>XxxStyle</code> objects. Learn it once here, then pick a chart from the sidebar.</p>

<h2 id="installation">Installation</h2>
<p>Compose Charts is published on <a href="${MAVEN}" target="_blank" rel="noreferrer">Maven Central</a>. No extra repository is needed, just make sure <code>mavenCentral()</code> is listed (new Android projects include it by default):</p>
${code(`// settings.gradle.kts
dependencyResolutionManagement {
    repositories {
        google()
        mavenCentral()
    }
}`,"settings.gradle.kts")}
<p>Then add the dependency:</p>
${code(`// app/build.gradle.kts
dependencies {
    ${DEP}
}`,"app/build.gradle.kts")}
<p>Or, with a version catalog:</p>
${code(`[versions]
composeCharts = "${VERSION}"

[libraries]
compose-charts = { group = "io.github.nameisjayant", name = "compose-charts", version.ref = "composeCharts" }`,"libs.versions.toml")}
<p class="callout">Requires <code>minSdk 24</code>. The library depends only on Compose UI, Foundation and Coroutines.</p>

<h2 id="two-ways">Card or bare chart</h2>
<p>Every chart comes in two versions:</p>
<ul>
  <li><strong><code>XxxChartCard</code></strong>: the chart inside a ready-made card, with a title, subtitle, legend and action slot.</li>
  <li><strong><code>XxxChart</code></strong>: the bare chart, with no card frame, to put inside your own layout. Give it a size with <code>modifier</code>.</li>
</ul>
${code(`val series = BarSeries(
    label = "Revenue",
    values = listOf(90f, 24f, 63f, 39f, 46f, 49f, 61f),
    color = VerticalBarChartDefaults.UpperBarColor,
)

// A finished card
VerticalBarChartCard(
    title = "Revenue",
    subtitle = "Statistics of the month",
    upperSeries = series,
)

// Or just the chart, in your own layout
VerticalBarChart(
    upperSeries = series,
    modifier = Modifier.fillMaxWidth().height(160.dp),
)`)}

<h2 id="styling">Styling</h2>
<p>Every chart card has three style layers: the card, the legend and the chart itself.</p>
${code(`VerticalBarChartCard(
    title = "Revenue",
    upperSeries = series,
    cardStyle = ChartCardDefaults.style(
        backgroundColor = MaterialTheme.colorScheme.surface,
        border = BorderStroke(1.dp, MaterialTheme.colorScheme.outlineVariant),
    ),
    legendStyle = ChartLegendDefaults.style(),
    chartStyle = VerticalBarChartDefaults.style(

)`)}
<p>The bare chart takes only the chart layer, through its <code>style</code> parameter (<code>VerticalBarChart(style = VerticalBarChartDefaults.style(...))</code>).</p>
<p class="callout">Every chart has its own <code>XxxChartDefaults</code> with a <code>style(...)</code> builder and ready-made colours, and most cards have an <code>XxxChartCardDefaults.style(...)</code> for header, chip, tab and footer colours.</p>

<h2 id="animation">Animation</h2>
<p>Values animate on first draw and whenever the data changes. Pass your own <code>animationSpec</code> to change the timing, or <code>null</code> to turn animation off:</p>
${code(`DonutChart(
    segments = segments,
    modifier = Modifier.size(160.dp),
    animationSpec = null, // draw the final state straight away
)`)}

<h2 id="charts">All charts</h2>
<div class="table-wrap"><table>
<thead><tr><th>Chart</th><th>Composables</th><th>Highlights</th></tr></thead>
<tbody>${CHARTS.map(c=>`<tr><td><a href="#/docs/${c.id}">${c.name}</a></td><td>${c.composables.map(x=>`<code>${x}</code>`).join(", ")}</td><td>${c.highlights}</td></tr>`).join("")}</tbody>
</table></div>
<p>More charts are on the way.</p>

<h2 id="sample-app">Sample app</h2>
<p>The <code>:app</code> module is a showcase app with one screen per chart. Each screen has <em>Shuffle data</em> and <em>Reset</em> buttons so you can watch the charts animate. It follows the system light or dark theme.</p>
${code(`./gradlew :app:installDebug`,"Terminal",true)}
${code(`ComposeCharts/
├── charts/   # The library: chart composables, styles, shared ChartCard and ChartLegend
└── app/      # Showcase app (Hilt + MVI) that demos every chart`,"Project structure",true)}

<h2 id="contributing">Contributing</h2>
<p>Issues and pull requests are welcome on <a href="${REPO}" target="_blank" rel="noreferrer">GitHub</a>. When you add a chart:</p>
<ol>
  <li>Add the chart composable, its <code>XxxStyle</code> and <code>XxxDefaults</code>, plus a <code>XxxChartCard</code> wrapper in <code>:charts</code>.</li>

</ol>`;
}

function chartToc(){return [["preview","Preview"],["data","Data"],["card","Chart card"],["chart-only","Chart only"],["notes","How it works"]]}

function renderDocs(slug){
  const idx = CHARTS.findIndex(c=>c.id===slug);
  const chart = idx>=0 ? CHARTS[idx] : null;
  const toc = chart ? chartToc().filter(([id])=>id!=="notes"||chart.notes.length) : OVERVIEW_TOC;
  const order = [{id:"",name:"Getting started"}, ...CHARTS];
  const pos = chart ? idx+1 : 0;

  const link = (o)=>`#/docs${o.id?"/"+o.id:""}`;

  <aside class="sidebar" id="sidebar" aria-label="Docs navigation">

          ${next?`<a class="next" href="${link(next)}"><span>Next →</span>${next.name}</a>`:""}
        </nav>
      </article>

      </nav>
    </div>
  </div>
</div>`;
}

/* ---------- Router ---------- */
const main = document.getElementById("main");
let tocObserver = null;
function route(){
  const h = location.hash;
  // In-page anchor (TOC link): scroll, keep the current page
  if (h && !h.startsWith("#/")) {
    if (h === "#main") return;
    const el = document.getElementById(h.slice(1));
    if (el) { el.scrollIntoView({behavior:"smooth"}); return; }
  }
  const path = h.startsWith("#/") ? h.slice(2) : "";
  const [section, slug] = path.split("/");
  const isDocs = section === "docs";
  CODES.length = 0;
  clearInterval(showTimer);
  if (tocObserver) tocObserver.disconnect();
  document.body.classList.remove("sidebar-open");
  main.innerHTML = isDocs ? renderDocs(slug) : renderHome();
  document.querySelectorAll(".tab").forEach(t=>{
    const on = t.dataset.tab === (isDocs?"docs":"home");
    t.classList.toggle("active", on);
    on ? t.setAttribute("aria-current","page") : t.removeAttribute("aria-current");
  });
  document.getElementById("menuBtn").classList.toggle("show", isDocs);
  const chart = isDocs && CHARTS.find(c=>c.id===slug);
  document.title = isDocs ? `${chart?chart.name:"Getting started"} · Compose Charts` : "Compose Charts";
  window.scrollTo(0,0);
  if (!isDocs) startShow();
  else watchToc();
}
function watchToc(){
  const links = [...document.querySelectorAll(".toc a")];
  const targets = links.map(a=>document.getElementById(a.dataset.target)).filter(Boolean);
  tocObserver = new IntersectionObserver(entries=>{
    entries.forEach(e=>{ if (e.isIntersecting) links.forEach(a=>a.classList.toggle("active", a.dataset.target===e.target.id)); });
  }, {rootMargin:"-80px 0px -70% 0px"});
  targets.forEach(t=>tocObserver.observe(t));
}

/* TOC links: scroll without changing the route */
document.addEventListener("click", e=>{
  const a = e.target.closest(".toc a");
  if (a) { e.preventDefault(); document.getElementById(a.dataset.target)?.scrollIntoView({behavior:"smooth"}); return; }
  const dot = e.target.closest(".dot");
  if (dot) { setShow(+dot.dataset.i); startShow(); return; }
  const btn = e.target.closest(".copy-btn");
  if (btn) {
    const text = btn.dataset.copy ?? CODES[+btn.dataset.code];
    navigator.clipboard?.writeText(text).then(()=>{
      btn.classList.add("copied"); btn.querySelector("span").textContent = "Copied";
      setTimeout(()=>{ btn.classList.remove("copied"); btn.querySelector("span").textContent = "Copy"; }, 1500);
    }).catch(()=>{});
  }
});

/* Theme toggle */
document.getElementById("themeBtn").addEventListener("click", ()=>{
  const root = document.documentElement;
  const dark = root.dataset.theme ? root.dataset.theme==="dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  root.dataset.theme = dark ? "light" : "dark";
  try { localStorage.setItem("theme", root.dataset.theme); } catch(e){}
});

/* Mobile sidebar */
document.getElementById("menuBtn").addEventListener("click", ()=>document.body.classList.toggle("sidebar-open"));
document.getElementById("backdrop").addEventListener("click", ()=>document.body.classList.remove("sidebar-open"));

document.querySelectorAll(".logo-slot").forEach(s=>s.outerHTML = LOGO(+s.dataset.size));
window.addEventListener("hashchange", route);
route();
</script>
